<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="120" fill="#0D0D0D" rx="8"/>

  <!-- Scanline effect -->
  <rect width="800" height="2" y="0" fill="#00FF41" opacity="0.03">
    <animate attributeName="y" from="-2" to="122" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Bracket left blink -->
  <text x="40" y="78" font-family="Courier New, monospace" font-size="52" font-weight="bold" fill="#00FF41">
    [
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Main title -->
  <text x="400" y="78" text-anchor="middle" font-family="Courier New, monospace" font-size="42" font-weight="bold" fill="#00FF41" letter-spacing="6">
    HACKER NEWS READER
    <animate attributeName="opacity" values="1;0.85;1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Bracket right blink -->
  <text x="755" y="78" font-family="Courier New, monospace" font-size="52" font-weight="bold" fill="#00FF41">
    ]
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Bottom blinking cursor -->
  <rect x="370" y="92" width="14" height="4" fill="#00FF41" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="390" y="92" width="14" height="4" fill="#00FF41" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="0.15s" repeatCount="indefinite"/>
  </rect>
  <rect x="410" y="92" width="14" height="4" fill="#00FF41" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="0.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner decorations -->
  <text x="10" y="18" font-family="Courier New, monospace" font-size="11" fill="#00FF41" opacity="0.4">▸ TOP STORIES // LIVE</text>
  <text x="620" y="18" font-family="Courier New, monospace" font-size="11" fill="#FF6600" opacity="0.6">HN://v1.0</text>
</svg>
